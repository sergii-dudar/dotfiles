# vim:ft=kitty

## name: VS Code Dark+ (vscode integrated-terminal palette)
## the same 16 colours and foreground as alacritty themes/vscode.toml (alacritty-theme repo), ghostty theme "Dark+",
## wezterm color_scheme "Dark+" and foot themes/vscode-dark. The themes ship background #1e1e1e; alacritty.toml
## overrides it and ghostty/wezterm/foot follow, so here too. cursor and selection are set in kitty.conf, not here.

#: The basic colors

foreground #cccccc
background #121212


#: The basic 16 colors

#: black
color0 #000000
color8 #666666

#: red
color1 #cd3131
color9 #f14c4c

#: green
color2 #0dbc79
color10 #23d18b

#: yellow
color3 #e5e510
color11 #f5f543

#: blue
color4 #2472c8
color12 #3b8eea

#: magenta
color5 #bc3fbc
color13 #d670d6

#: cyan
color6 #11a8cd
color14 #29b8db

#: white
color7 #e5e5e5
color15 #e5e5e5